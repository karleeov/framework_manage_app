<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Gear shape -->
  <g transform="translate(128,128)">
    <circle r="70" fill="none" stroke="#e94560" stroke-width="8"/>
    <g stroke="#e94560" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-85" x2="0" y2="-65"/>
      <line x1="0" y1="85" x2="0" y2="65"/>
      <line x1="-85" y1="0" x2="-65" y2="0"/>
      <line x1="85" y1="0" x2="65" y2="0"/>
      <line x1="-60" y1="-60" x2="-46" y2="-46"/>
      <line x1="60" y1="60" x2="46" y2="46"/>
      <line x1="-60" y1="60" x2="-46" y2="46"/>
      <line x1="60" y1="-60" x2="46" y2="-46"/>
    </g>
  </g>
  
  <!-- Inner circle -->
  <circle cx="128" cy="128" r="45" fill="#0f3460" stroke="#e94560" stroke-width="4"/>
  
  <!-- CPU chip -->
  <rect x="108" y="108" width="40" height="40" rx="4" fill="#e94560"/>
  <rect x="114" y="114" width="8" height="8" fill="#1a1a2e"/>
  <rect x="134" y="114" width="8" height="8" fill="#1a1a2e"/>
  <rect x="114" y="134" width="8" height="8" fill="#1a1a2e"/>
